<style>

s:10px;font-size:13px;font-weight:700}
@media(max-width:760px){.auth-wrap{width:min(440px,100%)}.auth-brand h1{font-size:28px}.auth-card{padding:18px}.student-hero{display:block}.student-id{display:inline-block;margin-top:15px}.status-grid{grid-template-columns:1fr}}

<body>
<div id="splash" class="splash"><div class="splash-card"><div class="logo">EV</div><h1>ENGLISH VISION</h1><div class="tag">Learn English, Build Confidence, Develop Skills, Become a Leader.</div><div class="bn">English Vision শুধু ইংরেজি শেখায় না,<br>আমরা তৈরি করি আত্মবিশ্বাস, English Speaker,<br>Presenter এবং Future Leader.</div><button class="primary" onclick="enterApp()">Enter English Vision</button></div></div>

<div id="app" class="app">
<aside class="sidebar"><div class="brand"><strong>English Vision</strong><small>Educational Application</small></div><nav id="sideNav" class="nav"></nav></aside>
<main class="main"><header class="topbar"><div><h2 id="pageTitle">Dashboard</h2></div><div class="top-actions"><button class="icon-btn" title="Notifications" onclick="toast('No new notifications')"></button><button class="icon-btn" title="Profile" onclick="showPage('settings')"></button><button class="icon-btn" id="menuBtn" onclick="toggleMobileNav()"></button></div></header><section id="content" class="content"></section></main>
<nav id="mobileNav" class="mobile-nav"></nav>
</div>
<div id="modalRoot"></div><div id="toast" class="toast"></div>

<script>
const KEYS={
students:'englishVision_students',vocabulary:'englishVision_vocabulary',words:'englishVision_words',sentences:'englishVision_sentences',
lessons:'englishVision_lessons',speakingPractice:'englishVision_speakingPractice',confidence:'englishVision_confidence',
expressYourself:'englishVision_expressYourself',futureLeader:'englishVision_futureLeader',dailyChallenges:'englishVision_dailyChallenges',
quizzes:'englishVision_quizzes',homework:'englishVision_homework',contentIdeas:'englishVision_contentIdeas',schedule:'englishVision_schedule',
progress:'englishVision_progress',settings:'englishVision_settings'
};
const labels={dashboard:'Dashboard',students:'Students',vocabulary:'Vocabulary',words:'Words',sentences:'Sentences',lessons:'Daily Lessons',speakingPractice:'Speak in Practice',confidence:'Confidence',expressYourself:'Express Yourself',futureLeader:'Future Leader',dailyChallenges:'Daily Challenge',quizzes:'Quiz',homework:'Homework',contentIdeas:'Content Ideas',calendar:'Calendar',progress:'My Progress',settings:'Settings'};
const icons={dashboard:'layout-dashboard',students:'users',vocabulary:'book-open',words:'type',sentences:'message-square',lessons:'book-open-text',speakingPractice:'mic',confidence:'target',expressYourself:'pen-line',futureLeader:'graduation-cap',dailyChallenges:'target',quizzes:'clipboard-check',homework:'clipboard-list',contentIdeas:'lightbulb',calendar:'calendar-days',progress:'chart-no-axes-column-increasing',settings:'settings'};
function iconSvg(name){const p={
'layout-dashboard':'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
'users':'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
'book-open':'<path d="M2 4.5A2.5 2.5 0 0 1 4.5 2H11v17H4.5A2.5 2.5 0 0 0 2 21.5z"/><path d="M22 4.5A2.5 2.5 0 0 0 19.5 2H13v17h6.5a2.5 2.5 0 0 1 2.5 2.5z"/>',
'book-open-text':'<path d="M2 4.5A2.5 2.5 0 0 1 4.5 2H11v17H4.5A2.5 2.5 0 0 0 2 21.5z"/><path d="M22 4.5A2.5 2.5 0 0 0 19.5 2H13v17h6.5a2.5 2.5 0 0 1 2.5 2.5z"/><path d="M6 6h2M6 9h3M16 6h2M16 9h3"/>',
'type':'<path d="M4 6h16M10 6v12M7 18h6"/>',
'type':'<path d="M4 6h16M10 6v12M7 18h6"/>',
'message-square':'<path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/>',
'mic':'<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3M8 22h8"/>',
' target':'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
'target':'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
'pen-line':'<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
'graduation-cap':'<path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12.5V17c3 2 9 2 12 0v-4.5"/><path d="M22 10v6"/>',
'clipboard-check':'<rect x="5" y="4" width="14" height="18" rx="2"/><path d="M9 4V2h6v2M9 13l2 2 4-4"/>',
'clipboard-list':'<rect x="5" y="4" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>',
'calendar-days':'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/>',
'chart-no-axes-column-increasing':'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
'settings':'<path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.5 1.5-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1 1.55V20h-2.1v-.41a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.88.34l-.06.06-1.5-1.5.06-.06A1.7 1.7 0 0 0 7.6 15a1.7 1.7 0 0 0-1.55-1H5.6v-2.1h.45a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.88l-.06-.06 1.5-1.5.06.06a1.7 1.7 0 0 0 1.88.34 1.7 1.7 0 0 0 1-1.55V5h2.1v.41a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.88-.34l.06-.06 1.5 1.5-.06.06A1.7 1.7 0 0 0 18.4 10a1.7 1.7 0 0 0 1.55 1h.45v2.1h-.45a1.7 1.7 0 0 0-1.55 1Z"/>',
'log-out':'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>','lightbulb':'<path d="M9 18h6M10 22h4M8 14a6 6 0 1 1 8 0c-1 1-1.5 2-1.5 4h-5C9.5 16 9 15 8 14Z"/>'};return `<span class="ui-icon" aria-hidden="true"><svg viewBox="0 0 24 24">${p[name]||p['book-open']}</svg></span>`}
function navIcon(k){return iconSvg(icons[k]||'book-open')}
const collections=['students','vocabulary','words','sentences','lessons','speakingPractice','confidence','expressYourself','futureLeader','dailyChallenges','quizzes','homework','contentIdeas','schedule'];

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function today(){return new Date().toISOString().slice(0,10)}
function getData(key){try{return JSON.parse(localStorage.getItem(KEYS[key])||'[]')}catch{return[]}}
function setData(key,data){localStorage.setItem(KEYS[key],JSON.stringify(data))}
function getSettings(){return JSON.parse(localStorage.getItem(KEYS.settings)||'null')||{name:'English Vision',tagline:'Learn English, Build Confidence, Develop Skills, Become a Leader.',theme:'Dark Blue',profile:'Admin'}}
function setSettings(v){localStorage.setItem(KEYS.settings,JSON.stringify(v))}
function getProgress(){return JSON.parse(localStorage.getItem(KEYS.progress)||'null')||{}}
function setProgress(v){localStorage.setItem(KEYS.progress,JSON.stringify(v))}
function getStudents(){return getData('students')} function saveStudent(v){v.id=v.id||uid();let a=getStudents();a.push(v);setData('students',a);return v} function updateStudent(id,v){let a=getStudents().map(x=>x.id===id?{...x,...v,id}:x);setData('students',a)} function deleteStudent(id){setData('students',getStudents().filter(x=>x.id!==id))}
function getVocabulary(){return getData('vocabulary')} function saveVocabulary(v){v.id=v.id||uid();let a=getVocabulary();a.push(v);setData('vocabulary',a)} function updateVocabulary(id,v){setData('vocabulary',getVocabulary().map(x=>x.id===id?{...x,...v,id}:x))} function deleteVocabulary(id){setData('vocabulary',getVocabulary().filter(x=>x.id!==id))}
function getQuizzes(){return getData('quizzes')} function saveQuiz(v){v.id=v.id||uid();let a=getQuizzes();a.push(v);setData('quizzes',a)} function updateQuiz(id,v){setData('quizzes',getQuizzes().map(x=>x.id===id?{...x,...v,id}:x))} function deleteQuiz(id){setData('quizzes',getQuizzes().filter(x=>x.id!==id))}
function saveCollection(k,v){v.id=v.id||uid();let a=getData(k);a.push(v);setData(k,a);return v}
function updateCollection(k,id,v){setData(k,getData(k).map(x=>x.id===id?{...x,...v,id}:x))}
function deleteCollection(k,id){setData(k,getData(k).filter(x=>x.id!==id))}
function resetDemo(){if(confirm('Reset all local demo data?')){localStorage.clear();seed();location.reload()}}
function enterApp(){sessionStorage.setItem('ev_entered','1');document.getElementById('splash').style.display='none';document.getElementById('app').style.display='flex';buildNav();showPage('dashboard')}
function buildNav(){let keys=Object.keys(labels);let h=keys.map(k=>`<button data-nav="${k}" onclick="showPage('${k}')">${icons[k]} &nbsp; ${labels[k]}</button>`).join('');document.getElementById('sideNav').innerHTML=h;document.getElementById('mobileNav').innerHTML=keys.slice(0,5).map(k=>`<button data-nav="${k}" onclick="showPage('${k}')">${icons[k]}<br>${labels[k].split(' ')[0]}</button>`).join('')}
function showPage(k){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===k));document.getElementById('pageTitle').textContent=labels[k];render(k)}

const USER_KEY='englishVision_users', SESSION_KEY='englishVision_currentUser';
function getUsers(){try{return JSON.parse(localStorage.getItem(USER_KEY)||'[]')}catch{return[]}}
function setUsers(v){localStorage.setItem(USER_KEY,JSON.stringify(v))}
function getCurrentUser(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch{return null}}
function setCurrentUser(v){localStorage.setItem(SESSION_KEY,JSON.stringify(v))}
function clearCurrentUser(){localStorage.removeItem(SESSION_KEY)}
function nextStudentId(){let nums=getUsers().filter(u=>u.role==='student').map(u=>parseInt(String(u.studentId||'').replace(/\D/g,''),10)||0);return 'EV-STU-'+String(Math.max(0,...nums)+1).padStart(4,'0')}
function ensureAuthData(){let users=getUsers();if(!users.some(u=>u.role==='admin'))users.unshift({userId:'EV-ADMIN-001',name:'Admin',email:'admin@englishvision.com',password:'Admin@123',role:'admin'});if(!users.some(u=>u.email.toLowerCase()==='student@englishvision.com'))users.push({userId:'EV-STU-0001',name:'Demo Student',email:'student@englishvision.com',password:'Student@123',role:'student',studentId:'EV-STU-0001'});if(!getStudents().some(x=>x.studentId==='EV-STU-0001'))saveStudent({studentName:'Demo Student',studentId:'EV-STU-0001',phone:'',email:'student@englishvision.com',batch:'Demo',level:'Beginner',joinDate:today(),status:'Active',notes:'Demo student account'});setUsers(users);if(!localStorage.getItem('englishVision_progress_EV-STU-0001'))localStorage.setItem('englishVision_progress_EV-STU-0001',JSON.stringify({vocabulary:2,words:1,sentences:1,lessons:1,speakingPractice:1,confidence:1,expressYourself:1,futureLeader:1,dailyChallenges:2,quizzes:1,homework:1,quizAverage:82,streak:5,completed:13}))}
function userProgress(){let u=getCurrentUser();if(!u||u.role!=='student')return getProgress();let k='englishVision_progress_'+u.userId;try{return JSON.parse(localStorage.getItem(k)||'{}')}catch{return{}}}
function saveUserProgress(p){let u=getCurrentUser();if(!u||u.role!=='student')return;localStorage.setItem('englishVision_progress_'+u.userId,JSON.stringify(p))}
function roleGuard(role){let u=getCurrentUser();if(!u||u.role!==role){toast(role==='admin'?'Access denied. Admin permission required.':'Please log in first.');return false}return true}
function authShell(view='login'){let root=document.getElementById('splash');root.style.display='grid';root.innerHTML=`<div class="auth-wrap"><div class="auth-brand"><div class="logo">EV</div><h1>ENGLISH VISION</h1><p>Learn English, Build Confidence, Develop Skills, Become a Leader.</p></div><div id="authCard" class="auth-card"></div></div>`;if(view==='login')renderLoginChoice();else if(view==='admin')renderAdminLogin();else renderSignup()}
function renderLoginChoice(){document.getElementById('authCard').innerHTML=`<h2>Welcome back!</h2><p class="auth-muted">Choose how you want to enter English Vision.</p><div class="auth-buttons"><button class="auth-primary" onclick="renderAdminLogin()"> Admin Login</button><button class="auth-secondary" onclick="renderStudentLogin()"> Student Login</button><button class="auth-link" onclick="renderSignup()">New Student? <b>Create Account</b></button></div>`}
function renderAdminLogin(){document.getElementById('authCard').innerHTML=`<button class="back-btn" onclick="renderLoginChoice()">← Back</button><h2>Admin Login</h2><p class="auth-muted">English Vision Administrator</p><form onsubmit="loginSubmit(event,'admin')"><div class="auth-field"><label>Email</label><input name="email" type="email" value="admin@englishvision.com" required></div><div class="auth-field"><label>Password</label><input name="password" type="password" value="Admin@123" required></div><button class="auth-primary" type="submit">Login as Admin</button></form>`}
function renderStudentLogin(){document.getElementById('authCard').innerHTML=`<button class="back-btn" onclick="renderLoginChoice()">← Back</button><h2>Student Login</h2><p class="auth-muted">Continue your English Vision journey.</p><form onsubmit="loginSubmit(event,'student')"><div class="auth-field"><label>Email</label><input name="email" type="email" required></div><div class="auth-field"><label>Password</label><input name="password" type="password" required></div><button class="auth-primary" type="submit">Login as Student</button></form><button class="auth-link" onclick="renderSignup()">New Student? <b>Create Account</b></button>`}
function renderSignup(){document.getElementById('authCard').innerHTML=`<button class="back-btn" onclick="renderLoginChoice()">← Back</button><h2>Create Your Student Account</h2><p class="auth-muted">Join English Vision and start learning.</p><form onsubmit="signupSubmit(event)"><div class="auth-field"><label>Full Name</label><input name="name" required></div><div class="auth-field"><label>Email</label><input name="email" type="email" required></div><div class="auth-field"><label>Password</label><input name="password" type="password" minlength="6" required></div><div class="auth-field"><label>Confirm Password</label><input name="confirm" type="password" minlength="6" required></div><div id="authError" class="auth-error"></div><button class="auth-primary" type="submit">Create Student Account</button></form>`}
function authError(msg){let e=document.getElementById('authError');if(e)e.textContent=msg;else toast(msg)}
function loginSubmit(e,role){e.preventDefault();let f=new FormData(e.target),email=String(f.get('email')).trim().toLowerCase(),password=String(f.get('password'));let u=getUsers().find(x=>x.email.toLowerCase()===email&&x.password===password&&x.role===role);if(!u){authError('Incorrect email or password.');return}setCurrentUser({userId:u.userId,name:u.name,email:u.email,role:u.role,studentId:u.studentId||null});openDashboard(u.role);toast('Welcome back!')}
function signupSubmit(e){e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')).trim(),email=String(f.get('email')).trim().toLowerCase(),password=String(f.get('password')),confirm=String(f.get('confirm'));if(!name||!email||!password||!confirm){authError('Please complete all fields.');return}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){authError('Please enter a valid email address.');return}if(password.length<6){authError('Password must be at least 6 characters.');return}if(password!==confirm){authError('Passwords do not match.');return}let users=getUsers();if(users.some(x=>x.email.toLowerCase()===email)){authError('An account with this email already exists.');return}let sid=nextStudentId(),u={userId:sid,name,email,password,role:'student',studentId:sid};users.push(u);setUsers(users);let student={studentName:name,studentId:sid,phone:'',email,batch:'New Student',level:'Beginner',joinDate:today(),status:'Active',notes:''};saveStudent(student);localStorage.setItem('englishVision_progress_'+sid,JSON.stringify({vocabulary:0,words:0,sentences:0,lessons:0,speakingPractice:0,confidence:0,expressYourself:0,futureLeader:0,dailyChallenges:0,quizzes:0,homework:0,quizAverage:0,streak:0,completed:0}));setCurrentUser({userId:sid,name,email,role:'student',studentId:sid});openDashboard('student');toast('Account created successfully!')}
function openDashboard(role){document.getElementById('splash').style.display='none';document.getElementById('app').style.display='flex';buildRoleNav(role);showPage(role==='admin'?'dashboard':'studentHome')}
function logout(){clearCurrentUser();document.getElementById('app').style.display='none';authShell('login');toast('Logged out successfully.')}
function buildRoleNav(role){let nav=document.getElementById('sideNav'),mobile=document.getElementById('mobileNav');if(role==='admin'){buildNav();nav.innerHTML+=`<button onclick="logout()"> Logout</button>`;mobile.innerHTML+=`<button onclick="logout()"><br>Logout</button>`;return}let keys=['studentHome','vocabulary','words','sentences','lessons','speakingPractice','confidence','expressYourself','futureLeader','dailyChallenges','quizzes','homework','progress','settings'];let studentLabels={studentHome:'Home',vocabulary:'Vocabulary',words:'Words',sentences:'Sentences',lessons:'Daily Lessons',speakingPractice:'Speak in Practice',confidence:'Confidence',expressYourself:'Express Yourself',futureLeader:'Future Leader',dailyChallenges:'Daily Challenge',quizzes:'Quiz',homework:'Homework',progress:'My Progress',settings:'Settings'};nav.innerHTML=`<div class="brand"><strong>English Vision</strong><small>Student Learning</small></div><nav class="nav">${keys.map(k=>`<button data-nav="${k}" onclick="studentNavigate('${k}')">${icons[k]||'⌂'} &nbsp; ${studentLabels[k]}</button>`).join('')}</nav><div class="student-user"><b>${escape(getCurrentUser()?.name||'Student')}</b><small>${escape(getCurrentUser()?.studentId||'')}</small><button onclick="logout()"> Logout</button></div>`;mobile.innerHTML=keys.slice(0,5).map(k=>`<button data-nav="${k}" onclick="studentNavigate('${k}')">${icons[k]||'⌂'}<br>${studentLabels[k].split(' ')[0]}</button>`).join('')+`<button onclick="logout()"><br>Logout</button>`}
function studentNavigate(k){if(!roleGuard('student'))return;document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===k));document.getElementById('pageTitle').textContent=(labels[k]||'Home');render(k)}
function renderStudentHome(c){if(!roleGuard('student'))return;let u=getCurrentUser(),st=getStudents().find(x=>x.studentId===u.studentId)||{};let p=userProgress();c.innerHTML=`<div class="student-hero"><div><span>English Vision</span><h1>Welcome, ${escape(u.name)} </h1><p>Your journey to English confidence starts here.</p></div><div class="student-id">${escape(u.studentId)}</div></div><div class="grid">${[['','Vocabulary','vocabulary'],['','New Words','words'],['','Sentences','sentences'],['','Daily Lessons','lessons'],['','Speak in Practice','speakingPractice'],['','Confidence','confidence'],['','Express Yourself','expressYourself'],['','Future Leader','futureLeader'],['','Daily Challenge','dailyChallenges'],['','Quiz','quizzes'],['','Homework','homework'],['','My Progress','progress']].map(x=>`<button class="card student-module" onclick="studentNavigate('${x[2]}')"><span>${x[0]}</span><b>${x[1]}</b><small>${x[2]==='progress'?(p.completed||0)+' activities completed':'Explore learning'}</small></button>`).join('')}</div><div class="section-title"><h3>Today's Learning</h3></div><div class="cards"><div class="card"><b>Today's Lesson</b><p>${escape(getData('lessons')[0]?.lessonTitle||'No lesson yet')}</p></div><div class="card"><b>Today's Challenge</b><p>${escape(getData('dailyChallenges').find(x=>x.date===today())?.challengeTitle||getData('dailyChallenges')[0]?.challengeTitle||'No challenge yet')}</p></div><div class="card"><b>Learning Progress</b><p>${p.completed||0} completed activities · ${p.streak||0} day streak</p></div></div>`}
function renderProgress(c){if(!roleGuard('student')){if(getCurrentUser()?.role==='admin')renderAdminProgress(c);return}let p=userProgress();let metrics=[['Vocabulary Learned',p.vocabulary||0],['Words Learned',p.words||0],['Sentences Completed',p.sentences||0],['Lessons Completed',p.lessons||0],['Speak in Practice Completed',p.speakingPractice||0],['Confidence Completed',p.confidence||0],['Express Yourself Completed',p.expressYourself||0],['Future Leader Completed',p.futureLeader||0],['Daily Challenges Completed',p.dailyChallenges||0],['Quizzes Completed',p.quizzes||0],['Homework Completed',p.homework||0]];c.innerHTML=`<div class="student-hero"><div><span>My Progress</span><h1>Your learning journey</h1><p>Your progress is saved to your individual student account.</p></div></div><div class="grid">${metrics.map(([n,v])=>`<div class="card"><span>${n}</span><b>${v}</b><div class="progress"><i style="width:${Math.min(100,v*10)}%"></i></div></div>`).join('')}</div><div class="cards" style="margin-top:14px"><div class="card"><b>Quiz Average Score</b><h2>${p.quizAverage||0}%</h2></div><div class="card"><b>Learning Streak</b><h2>${p.streak||0} days</h2></div><div class="card"><b>Completed Activities</b><h2>${p.completed||0}</h2></div></div>`}
function renderSettings(c){let u=getCurrentUser();if(u?.role==='student'){let st=getStudents().find(x=>x.studentId===u.studentId)||{};c.innerHTML=`<div class="section-title"><h3>Student Profile</h3></div><div class="card"><div class="form-grid"><div class="field"><label>Full Name</label><input id="profileName" value="${escape(u.name)}"></div><div class="field"><label>Email</label><input value="${escape(u.email)}" disabled></div><div class="field"><label>Student ID</label><input value="${escape(u.studentId)}" disabled></div><div class="field"><label>Account Type</label><input value="Student" disabled></div></div><div class="actions" style="margin-top:16px"><button class="primary" onclick="updateStudentProfile()">Save Name</button><button class="btn" onclick="logout()">Logout</button></div></div><div class="section-title"><h3>Step 2 Status</h3></div>${statusHTML()}`;return}renderAdminSettings(c)}
function updateStudentProfile(){let u=getCurrentUser(),name=document.getElementById('profileName').value.trim();if(!name){toast('Name is required');return}let users=getUsers().map(x=>x.userId===u.userId?{...x,name}:x);setUsers(users);u.name=name;setCurrentUser(u);let st=getStudents().find(x=>x.studentId===u.studentId);if(st)updateStudent(st.id,{studentName:name});buildRoleNav('student');toast('Profile updated');render('settings')}
function statusHTML(){return `<div class="status-grid">${['Admin Login','Student Login','Student Registration','Admin Dashboard','Student Dashboard','Role Protection','Individual Student ID','Individual Progress','Session Persistence','Logout'].map(x=>`<div> ${x}</div>`).join('')}</div>`}
function renderAdminSettings(c){let s=getSettings();c.innerHTML=`<div class="section-title"><h3>Settings</h3></div><div class="card"><div class="form-grid"><div class="field"><label>English Vision Name</label><input id="setName" value="${escape(s.name)}"></div><div class="field"><label>Tagline</label><input id="setTag" value="${escape(s.tagline)}"></div><div class="field"><label>Theme</label><select id="setTheme"><option>Dark Blue</option><option>Blue</option></select></div><div class="field"><label>Profile</label><input id="setProfile" value="${escape(s.profile)}"></div></div><div class="actions" style="margin-top:16px"><button class="primary" onclick="saveSettingsUI()">Save Settings</button></div></div><div class="section-title"><h3>Data Management</h3></div><div class="cards"><button class="card btn" onclick="exportData()">⬇ Export All Data</button><button class="card btn" onclick="document.getElementById('importFile').click()">⬆ Import Data</button><button class="card btn red" onclick="resetDemo()">↻ Reset Demo Data</button></div><input id="importFile" type="file" accept=".json" hidden onchange="importData(this)"><div class="section-title"><h3>Step 2 Status</h3></div>${statusHTML()}`}

function activityFor(studentId,contentId){return getActivities().find(x=>x.studentId===studentId&&x.contentId===contentId)||null}
function activityType(k){return ({vocabulary:'vocabulary',words:'word',sentences:'sentence',lessons:'lesson',speakingPractice:'speakingPractice',confidence:'confidence',expressYourself:'expressYourself',futureLeader:'futureLeader',dailyChallenges:'dailyChallenge',quizzes:'quiz',homework:'homework'})[k]||k}
function saveActivity(contentId,contentType,status='Completed',score=null){let u=getCurrentUser();if(!u||u.role!=='student')return;let a=getActivities(),i=a.findIndex(x=>x.studentId===u.studentId&&x.contentId===contentId);let old=i>=0?a[i]:{};let rec={id:old.id||uid(),studentId:u.studentId,contentId,contentType,status,completed:status==='Completed',completedAt:status==='Completed'?(old.completedAt||new Date().toISOString()):old.completedAt||null,score:score==null?(old.score??null):score};if(i>=0)a[i]=rec;else a.push(rec);setActivities(a);syncLegacyProgress(u.studentId);return rec}
function syncLegacyProgress(studentId){let u=getUsers().find(x=>x.studentId===studentId&&x.role==='student');if(!u)return;let acts=getActivities().filter(x=>x.studentId===studentId&&x.completed);let counts={vocabulary:0,words:0,sentences:0,lessons:0,speakingPractice:0,confidence:0,expressYourself:0,futureLeader:0,dailyChallenges:0,quizzes:0,homework:0},map={vocabulary:'vocabulary',word:'words',sentence:'sentences',lesson:'lessons',speakingPractice:'speakingPractice',confidence:'confidence',expressYourself:'expressYourself',futureLeader:'futureLeader',dailyChallenge:'dailyChallenges',quiz:'quizzes',homework:'homework'};let scores=[];acts.forEach(a=>{let key=map[a.contentType];if(key)counts[key]++;if(a.contentType==='quiz'&&typeof a.score==='number')scores.push(a.score)});let p={...JSON.parse(localStorage.getItem('englishVision_progress_'+studentId)||'{}'),...counts,completed:acts.length,quizAverage:scores.length?Math.round(scores.reduce((x,y)=>x+y,0)/scores.length):0};localStorage.setItem('englishVision_progress_'+studentId,JSON.stringify(p))}
function todayItems(k){let d=getData(k);return d.filter(x=>{let active=String(x.status||'Published').toLowerCase()!=='draft'&&String(x.status||'Published').toLowerCase()!=='pending';let ds=x.date||x.assignedDate||x.publishDate||x.deadline;return active&&(!ds||ds===today())}).filter(x=>String(x.target||'All Students').toLowerCase()!=='individual' || x.studentId===getCurrentUser()?.studentId)}
function contentTitle(k,x){return x?.englishWord||x?.word||x?.englishSentence||x?.lessonTitle||x?.practiceTitle||x?.title||x?.challengeTitle||x?.quizTitle||x?.homeworkTitle||'Learning Activity'}
function contentDescription(k,x){return x?.banglaMeaning||x?.meaning||x?.exampleSentence||x?.description||x?.lessonContent||x?.speakingPrompt||x?.practiceTask||x?.prompt||x?.challenge||x?.homeworkTask||x?.instructions||''}
function activityCard(k,x){let u=getCurrentUser(),a=activityFor(u.studentId,x.id),done=a?.completed;let action=k==='quizzes'?`<button class="primary" onclick="studentTakeQuiz('${x.id}')">${done?'View Result':'Take Quiz'}</button>`:k==='homework'?`<button class="primary" onclick="studentComplete('${k}','${x.id}')">${done?' Completed':'Submit / Complete'}</button>`:`<button class="primary" onclick="studentComplete('${k}','${x.id}')">${done?' Completed':' Mark Complete'}</button>`;let learn=k==='lessons'?`<button class="btn blue" onclick="studentLearn('${k}','${x.id}')">Start Lesson</button>`:k==='speakingPractice'?`<button class="btn blue" onclick="studentLearn('${k}','${x.id}')">Start Practice</button>`:k==='dailyChallenges'?`<button class="btn blue" onclick="studentLearn('${k}','${x.id}')">Start Challenge</button>`:k==='homework'?`<button class="btn blue" onclick="studentLearn('${k}','${x.id}')">View Task</button>`:k==='quizzes'?'':`<button class="btn blue" onclick="studentLearn('${k}','${x.id}')">Learn</button>`;return `<div class="card learning-card" id="activity-${x.id}"><div class="activity-status">${done?' Completed':a?.status==='In Progress'?' In Progress':' Not Started'}</div><h3>${escape(contentTitle(k,x))}</h3><p>${escape(contentDescription(k,x))}</p>${x.example||x.exampleSentence?`<small><b>Example:</b> ${escape(x.example||x.exampleSentence)}</small>`:''}${x.topic?`<small><b>Topic:</b> ${escape(x.topic)}</small>`:''}${x.speakingPrompt?`<small><b>Practice:</b> ${escape(x.speakingPrompt)}</small>`:''}<div class="actions" style="margin-top:14px">${learn}${action}</div></div>`}
function studentComplete(k,id){let u=getCurrentUser();if(!u||u.role!=='student')return;let old=activityFor(u.studentId,id);if(old?.completed){toast('Already completed.');return}saveActivity(id,activityType(k),'Completed');toast('Completed successfully!');renderStudentHome(document.getElementById('content'))}
function studentLearn(k,id){let u=getCurrentUser();if(!u||u.role!=='student')return;let old=activityFor(u.studentId,id);if(old?.completed)return;saveActivity(id,activityType(k),'In Progress');toast('Activity started');renderStudentPage(k)}
function studentTakeQuiz(id){let q=getQuizzes().find(x=>x.id===id);if(!q)return;let u=getCurrentUser(),old=activityFor(u.studentId,id);let html=`<div class="modal-backdrop show"><div class="modal"><div class="modal-head"><h3>${escape(q.quizTitle)}</h3><button class="icon-btn" onclick="closeModal()"></button></div><form onsubmit="submitStudentQuiz(event,'${id}')"><div class="modal-body">${(q.questions||[]).map((x,i)=>`<div class="card" style="margin-bottom:10px"><b>${i+1}. ${escape(x.question)}</b><div class="quiz-options">${['a','b','c','d'].filter(n=>x[n]).map(n=>`<label><input type="radio" name="q${i}" value="${escape(x[n])}" ${old?.answers?.[i]===x[n]?'checked':''}> ${escape(x[n])}</label>`).join('')}</div></div>`).join('')}</div><div class="modal-foot"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="primary">${old?.completed?'Retake Quiz':'Submit Quiz'}</button></div></form></div></div>`;document.getElementById('modalRoot').innerHTML=html}
function submitStudentQuiz(e,id){e.preventDefault();let q=getQuizzes().find(x=>x.id===id),fd=new FormData(e.target),correct=0,total=(q.questions||[]).reduce((n,x)=>n+(Number(x.marks)||1),0)||1,answers=[];(q.questions||[]).forEach((x,i)=>{let ans=fd.get('q'+i)||'';answers.push(ans);if(String(ans).trim().toLowerCase()===String(x.correct||'').trim().toLowerCase())correct+=Number(x.marks)||1});let score=Math.round(correct/total*100),u=getCurrentUser(),rec=saveActivity(id,activityType('quizzes'),'Completed',score);let a=getActivities(),idx=a.findIndex(x=>x.id===rec.id);a[idx].answers=answers;a[idx].score=score;setActivities(a);syncLegacyProgress(u.studentId);closeModal();toast(`Quiz submitted: ${score}%`);showPage('studentHome')}
function studentActivityTypes(){return [['vocabulary','','Today’s Vocabulary'],['words','','Today’s New Words'],['sentences','','Today’s Sentences'],['lessons','','Today’s Daily Lesson'],['speakingPractice','','Today’s Speaking Practice'],['confidence','','Today’s Confidence Activity'],['expressYourself','','Today’s Express Yourself'],['futureLeader','','Today’s Future Leader Activity'],['dailyChallenges','','Today’s Daily Challenge'],['quizzes','','Today’s Quiz'],['homework','','Today’s Homework']]}
function todayActivityStats(){let u=getCurrentUser(),all=[];studentActivityTypes().forEach(([k])=>todayItems(k).forEach(x=>all.push({k,x})));let done=all.filter(z=>activityFor(u.studentId,z.x.id)?.completed).length;return {all,done,total:all.length}}
function renderStudentHome(c){if(!roleGuard('student'))return;let u=getCurrentUser(),s=todayActivityStats(),pct=s.total?Math.round(s.done/s.total*100):0;c.innerHTML=`<div class="student-hero"><div><span>English Vision</span><h1>Welcome, ${escape(u.name)}</h1><p>Today is your learning day. Learn, answer, complete and track your progress.</p></div><div class="student-id">${escape(u.studentId)}</div></div><div class="card" style="margin-bottom:18px"><div class="section-title"><h3>Today’s Progress</h3><b>${s.done} / ${s.total} Activities Completed</b></div><div class="progress" style="height:12px"><i style="width:${pct}%"></i></div><p style="margin:8px 0 0"><b>Progress: ${pct}%</b></p></div><div class="section-title"><h3>Today’s Learning</h3></div>${s.total?`<div class="cards">${s.all.map(z=>activityCard(z.k,z.x)).join('')}</div>`:'<div class="empty card">No activity assigned for today.</div>'}<div class="section-title" style="margin-top:22px"><h3>Learning Sections</h3></div><div class="cards">${studentActivityTypes().map(([k,ic,n])=>`<button class="card student-module" onclick="studentNavigate('${k}')">${iconSvg(ic)}<b>${n.replace('Today’s ','')}</b><small>View learning content</small></button>`).join('')}<button class="card student-module" onclick="studentNavigate('progress')">${iconSvg('chart-no-axes-column-increasing')}<b>My Progress</b><small>Track your learning</small></button></div>`}
function renderStudentPage(k){let c=document.getElementById('content');let title=labels[k]||'Learning';if(k==='progress'){renderProgress(c);return}let items=todayItems(k);c.innerHTML=`<div class="student-hero"><div><span>English Vision · Learning</span><h1>${escape(title)}</h1><p>Only content assigned/published by your Admin/Teacher is shown here.</p></div></div><div class="cards">${items.length?items.map(x=>activityCard(k,x)).join(''):'<div class="empty card">No activity assigned for today.</div>'}</div>`}
function renderProgress(c){let u=getCurrentUser();if(u?.role==='admin'){renderAdminProgress(c);return}if(!roleGuard('student'))return;let s=todayActivityStats(),pct=s.total?Math.round(s.done/s.total*100):0;c.innerHTML=`<div class="student-hero"><div><span>My Progress</span><h1>Your Today’s Progress</h1><p>Your activity records belong only to your student account.</p></div></div><div class="card"><h3>${s.done} / ${s.total} Completed</h3><div class="progress" style="height:12px"><i style="width:${pct}%"></i></div><p>${pct}% completed today</p></div><div class="cards">${s.all.map(z=>{let a=activityFor(u.studentId,z.x.id);return `<div class="card"><b>${escape(contentTitle(z.k,z.x))}</b><p>${a?.completed?' Completed':a?.status==='In Progress'?' In Progress':' Not Started'}${z.k==='quizzes'&&typeof a?.score==='number'?` · ${a.score}%`:''}</p></div>`}).join('')}</div>`}
function renderAdminProgress(c){if(!roleGuard('admin'))return;let students=getStudents(),selected=document.getElementById('progressStudent')?.value||students[0]?.studentId||'';let st=students.find(x=>x.studentId===selected)||students[0];if(!st){c.innerHTML='<div class="empty card">No students found.</div>';return}let all=[];studentActivityTypes().forEach(([k])=>todayItems(k).forEach(x=>all.push({k,x})));let acts=getActivities().filter(a=>a.studentId===st.studentId),done=all.filter(z=>acts.some(a=>a.contentId===z.x.id&&a.completed)).length,total=all.length,pct=total?Math.round(done/total*100):0;let quiz=all.find(z=>z.k==='quizzes'),qa=quiz?acts.find(a=>a.contentId===quiz.x.id):null;c.innerHTML=`<div class="section-title"><h3>Student Progress</h3><select id="progressStudent" onchange="renderAdminProgress(document.getElementById('content'))">${students.map(x=>`<option value="${escape(x.studentId)}" ${x.studentId===st.studentId?'selected':''}>${escape(x.studentName)} · ${escape(x.studentId)}</option>`).join('')}</select></div><div class="card"><h2>${escape(st.studentName)}</h2><p>ID: ${escape(st.studentId)} · ${escape(st.email||'')}</p><h3>Today’s Progress: ${done} / ${total} Completed</h3><div class="progress" style="height:12px"><i style="width:${pct}%"></i></div><p>Overall completion: ${pct}%</p>${qa&&typeof qa.score==='number'?`<p><b>Quiz:</b> ${Math.round((qa.score/100)*(quiz.x.questions||[]).reduce((n,x)=>n+(Number(x.marks)||1),0))} / ${(quiz.x.questions||[]).reduce((n,x)=>n+(Number(x.marks)||1),0)} (${qa.score}%)</p>`:''}</div><div class="cards">${all.map(z=>{let a=acts.find(a=>a.contentId===z.x.id);return `<div class="card"><b>${escape(contentTitle(z.k,z.x))}</b><p>${a?.completed?' Completed':a?.status==='In Progress'?' In Progress':' Not Completed'}${z.k==='quizzes'&&typeof a?.score==='number'?` — ${a.score}%`:''}</p></div>`}).join('')||'<div class="empty card">No content assigned today.</div>'}</div>`}
function renderStudents(c){if(!roleGuard('admin'))return;let students=getStudents();c.innerHTML=`<div class="section-title"><h3>Students</h3><button class="primary" onclick="openForm('students')"> Add Student</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Student Name</th><th>Student ID</th><th>Email</th><th>Today’s Progress</th><th>Quiz Score</th><th>Completed</th><th>Status</th><th>Action</th></tr></thead><tbody>${students.map(st=>{let all=[];studentActivityTypes().forEach(([k])=>todayItems(k).forEach(x=>all.push({k,x})));let acts=getActivities().filter(a=>a.studentId===st.studentId&&a.completed),done=all.filter(z=>acts.some(a=>a.contentId===z.x.id)).length,total=all.length,qa=acts.find(a=>a.contentType==='quiz'&&typeof a.score==='number');return `<tr><td>${escape(st.studentName)}</td><td>${escape(st.studentId)}</td><td>${escape(st.email||'')}</td><td>${done}/${total}</td><td>${qa?qa.score+'%':'—'}</td><td>${acts.length}</td><td>${escape(st.status||'Active')}</td><td><button class="btn blue" onclick="showStudentProgress('${escape(st.studentId)}')">View Progress</button></td></tr>`}).join('')}</tbody></table></div>`}

function normalizeContentMeta(){let keys=['vocabulary','words','sentences','lessons','speakingPractice','confidence','expressYourself','futureLeader','dailyChallenges','quizzes','homework'];keys.forEach(k=>{let a=getData(k);if(!a.length)return;let changed=false;a=a.map(x=>{let y={...x};if(!y.date&&!y.assignedDate&&!y.deadline&&k!=='homework'){y.date=today();changed=true}if(!y.status)y.status='Published';if(!y.target)y.target='All Students';return y});if(changed)setData(k,a)})}

function saveQuizForm(e,id){if(!roleGuard('admin'))return;e.preventDefault();let f=e.target,fd=new FormData(f),questions=[...document.querySelectorAll('#quizQuestions>[data-q]')].map(card=>{let g=n=>card.querySelector(`[name="${n}"]`)?.value||'';return{question:g('qtext'),type:g('qtype'),correct:g('correct'),a:g('a'),b:g('b'),c:g('c'),d:g('d'),marks:Number(g('marks'))||1}}).filter(x=>x.question);let q={quizTitle:fd.get('quizTitle'),category:fd.get('category'),description:fd.get('description'),level:fd.get('level'),date:fd.get('date')||today(),timeLimit:fd.get('timeLimit'),passingScore:Number(fd.get('passingScore'))||60,status:fd.get('status')||'Published',target:fd.get('target')||'All Students',questions};id?updateQuiz(id,q):saveQuiz(q);closeModal();toast('Quiz published');render('quizzes')}

<script>
function iconSvg(name){const map={dashboard:'layout-dashboard',students:'users',vocabulary:'book-open',words:'type',sentences:'message-square',lessons:'book-open-text',speakingPractice:'mic',confidence:'target',expressYourself:'pen-line',futureLeader:'graduation-cap',dailyChallenges:'target',quizzes:'clipboard-check',homework:'clipboard-list',contentIdeas:'lightbulb',calendar:'calendar-days',progress:'chart-no-axes-column-increasing',settings:'settings',logout:'log-out',home:'house',notifications:'bell',profile:'user'};const n=map[name]||name;const p={
'layout-dashboard':'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>','users':'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>','book-open':'<path d="M2 4.5A2.5 2.5 0 0 1 4.5 2H11v17H4.5A2.5 2.5 0 0 0 2 21.5z"/><path d="M22 4.5A2.5 2.5 0 0 0 19.5 2H13v17h6.5a2.5 2.5 0 0 1 2.5 2.5z"/>','type':'<path d="M4 6h16M10 6v12M7 18h6"/>','message-square':'<path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/>','book-open-text':'<path d="M2 4.5A2.5 2.5 0 0 1 4.5 2H11v17H4.5A2.5 2.5 0 0 0 2 21.5z"/><path d="M22 4.5A2.5 2.5 0 0 0 19.5 2H13v17h6.5a2.5 2.5 0 0 1 2.5 2.5z"/><path d="M6 7h3M15 7h3M6 10h4M15 10h4"/>','mic':'<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3M8 22h8"/>','target':'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>','pen-line':'<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>','graduation-cap':'<path d="m2 8 10-5 10 5-10 5L2 8Z"/><path d="M6 10.5V16c3 2 9 2 12 0v-5.5M22 8v6"/>','clipboard-check':'<rect x="5" y="4" width="14" height="18" rx="2"/><path d="M9 4V2h6v2M8 13l2 2 5-5"/>','clipboard-list':'<rect x="5" y="4" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>','lightbulb':'<path d="M9 18h6M10 22h4M8 14a6 6 0 1 1 8 0c-1 1-1.5 2-1.5 3h-5c0-1-.5-2-1.5-3Z"/>','calendar-days':'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 9h18M8 13h.01M12 13h.01M16 13h.01M8 17h.01M12 17h.01"/>','chart-no-axes-column-increasing':'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>','settings':'<path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="m19.4 15 .1.1a2 2 0 1 1-2.8 2.8l-.1-.1a2 2 0 0 0-3.4 1.4V19a2 2 0 1 1-4 0v-.1A2 2 0 0 0 5.8 17l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A2 2 0 0 0 1.6 11H1.5a2 2 0 1 1 0-4h.1A2 2 0 0 0 3 3.6l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A2 2 0 0 0 9.2 1.4V1.3a2 2 0 1 1 4 0v.1A2 2 0 0 0 16.6 3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A2 2 0 0 0 20.8 9h.1a2 2 0 1 1 0 4h-.1a2 2 0 0 0-1.4 2Z"/>','house':'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M9 21v-7h6v7"/>','log-out':'<path d="M10 17l5-5-5-5M15 12H3M21 19V5a2 2 0 0 0-2-2h-6"/>','user':'<circle cx="12" cy="7" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>','bell':'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>'};return `<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g>${p[n]||p['target']}</g></svg>`}
function buildNav(){let keys=Object.keys(labels);let h=keys.map(k=>`<button data-nav="${k}" onclick="showPage('${k}')">${iconSvg(k)}<span>${labels[k]}</span></button>`).join('');document.getElementById('sideNav').innerHTML=h;document.getElementById('mobileNav').innerHTML=keys.slice(0,5).map(k=>`<button data-nav="${k}" onclick="showPage('${k}')">${iconSvg(k)}<span>${labels[k].split(' ')[0]}</span></button>`).join('')}
function buildRoleNav(role){let nav=document.getElementById('sideNav'),mobile=document.getElementById('mobileNav');if(role==='admin'){buildNav();nav.innerHTML+=`<button onclick="logout()">${iconSvg('logout')}<span>Logout</span></button>`;mobile.innerHTML+=`<button onclick="logout()">${iconSvg('logout')}<span>Logout</span></button>`;return}let keys=['studentHome','vocabulary','words','sentences','lessons','speakingPractice','confidence','expressYourself','futureLeader','dailyChallenges','quizzes','homework','progress','settings'];let studentLabels={studentHome:'Home',vocabulary:'Vocabulary',words:'Words',sentences:'Sentences',lessons:'Daily Lessons',speakingPractice:'Speak in Practice',confidence:'Confidence',expressYourself:'Express Yourself',futureLeader:'Future Leader',dailyChallenges:'Daily Challenge',quizzes:'Quiz',homework:'Homework',progress:'My Progress',settings:'Settings'};nav.innerHTML=`<div class="brand"><strong>English Vision</strong><small>Student Learning</small></div><nav class="nav">${keys.map(k=>`<button data-nav="${k}" onclick="studentNavigate('${k}')">${iconSvg(k)}<span>${studentLabels[k]}</span></button>`).join('')}</nav><div class="student-user"><b>${escape(getCurrentUser()?.name||'Student')}</b><small>${escape(getCurrentUser()?.studentId||'')}</small><button onclick="logout()">${iconSvg('logout')} Logout</button></div>`;mobile.innerHTML=keys.slice(0,5).map(k=>`<button data-nav="${k}" onclick="studentNavigate('${k}')">${iconSvg(k)}<span>${studentLabels[k].split(' ')[0]}</span></button>`).join('')+`<button onclick="logout()">${iconSvg('logout')}<span>Logout</span></button>`}
function renderStudentHome(c){if(!roleGuard('student'))return;let u=getCurrentUser(),s=todayActivityStats(),pct=s.total?Math.round(s.done/s.total*100):0;c.innerHTML=`<div class="student-hero"><div><span>English Vision</span><h1>Welcome, ${escape(u.name)}</h1><p>Today is your learning day. Learn, practice, complete and track your progress.</p></div><div class="student-id">${escape(u.studentId)}</div></div><div class="card" style="margin-bottom:18px"><div class="section-title"><h3>Today's Progress</h3><b>${s.done} / ${s.total} Activities Completed</b></div><div class="progress" style="height:12px"><i style="width:${pct}%"></i></div><p style="margin:8px 0 0"><b>Progress: ${pct}%</b></p></div><div class="section-title"><h3>Today's Learning</h3></div>${s.total?`<div class="cards">${s.all.map(z=>activityCard(z.k,z.x)).join('')}</div>`:'<div class="empty card">No activity assigned for today.</div>'}<div class="section-title" style="margin-top:22px"><h3>Learning Sections</h3></div><div class="cards">${studentActivityTypes().map(([k,ic,n])=>`<button class="card student-module" onclick="studentNavigate('${k}')">${iconSvg(k)}<b>${n.replace("Today’s ",'')}</b><small>View learning content</small></button>`).join('')}<button class="card student-module" onclick="studentNavigate('progress')">${iconSvg('progress')}<b>My Progress</b><small>Track your learning</small></button></div>`}
</script>
</body>
</html>
